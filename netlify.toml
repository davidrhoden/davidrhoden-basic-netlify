[build]
  publish = "_site"
# git lfs pull is required: GIT_LFS_ENABLED alone does NOT reliably fetch LFS
# objects during Netlify's checkout, so new images would deploy as 131-byte
# pointer files (and Netlify's image CDN 404s them). Fetch explicitly first.
command = "git lfs install && git lfs pull && npm run build"

[build.environment]
NODE_OPTIONS="--max-old-space-size=4096"
# Fetch Git LFS files from GitHub at build time (was: Netlify Large Media, deprecated 2023)
GIT_LFS_ENABLED="true"

# [functions]
#   node_bundler = "esbuild"

[build.processing]
  skip_processing = true

[build.cache]
  paths = ["node_modules", ".cache"]

# REDIRECT and HEADERS examples

# Redirect rule example
# For more information see:- https://www.netlify.com/docs/netlify-toml-reference/

#[[redirects]]
#  from = "/*"
#  to = "/blog/:splat"

# The default HTTP status code is 301, but you can define a different one e.g.
# status = 302

# Headers rule example
# For more information see:- https://www.netlify.com/docs/netlify-toml-reference/

#[[headers]]
#   Define which paths this specific [[headers]] block will cover.
#   for = "/*"

#[headers.values]
#   X-Frame-Options = "DENY"
#   X-XSS-Protection = "1; mode=block"
#   Content-Security-Policy = "frame-ancestors https://www.facebook.com"

# Redirects and headers are GLOBAL for all builds – they do not get scoped to
# contexts no matter where you define them in the file.
# For context-specific rules, use _headers or _redirects files, which are
# applied on a PER-DEPLOY basis.

